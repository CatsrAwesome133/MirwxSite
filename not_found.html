<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="icon" type="image/x-icon" href="ph.ico">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
  <script>
      window.addEventListener('DOMContentLoaded', () => {
        bgElements = document.querySelectorAll('.bg');
        bgContainer = document.getElementById('bg')
      });

      window.addEventListener('scroll', () => {
        const scrollPosition = window.scrollY;
        
        bgElements.forEach((bg) => {
          bg.style.transform = `translateY(${scrollPosition * -0.3}px)`;
        });
      });
    </script>
  </head>

  <body style="overflow-x: hidden;">
    <!-- background-->
    <div class="make-blue bg" style="padding: 0; margin: 0;">
      <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
      <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
      <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
    </div>

    <div class="make-blue bg right" style="padding: 0; margin: 0;">
      <div style="transform: scale(-1, 1); display: flex; flex-direction: column;">
        <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
        <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
        <img src="https://f2.toyhou.se/file/f2-toyhou-se/images/131802355_Z3gJhHSSkDFf052.png">
      </div>
    </div>
    <div style="display: grid; height: 90dvh; justify-content: center; align-items: center;">
      <div style="margin: auto;">
        <h1 id="notfound">404</h1>
        <p>The requested page was not found. Sorry!</p>

        <h2 style="opacity: 0.5; border-width: 1.7px;"></h2>

        <a href="index.html">
          <p>
            <img class="img-nav" style="margin-bottom: -20px;" src="https://f2.toyhou.se/file/f2-toyhou-se/images/129223884_mA2VHQLk65ifwpa.png">
          </p>
          <p class="highlight">Back to home</p>
        </a>
      </div>
    </div>
  </body>
</html>
